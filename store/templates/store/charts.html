<div class="row g-4">
    <!-- Category Distribution -->
    <div class="col-md-6 col-lg-6">
        <div class="card shadow border-0 mb-4 h-100">
            <div class="card-body">
                <h5 class="card-title">Category Distribution</h5>

                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Sales Over Time -->
    <div class="col-md-6 col-lg-6">
        <div class="card shadow border-0 mb-4 h-100">
            <div class="card-body">
                <h5 class="card-title">Sales Over Time</h5>

                <div class="chart-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Django JSON data -->
{{ categories|json_script:"categories-data" }}
{{ category_counts|json_script:"category-counts-data" }}
{{ sale_dates_labels|json_script:"sale-dates-labels-data" }}
{{ sale_dates_values|json_script:"sale-dates-values-data" }}


<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    // Get Django data safely
    const categories = JSON.parse(
        document.getElementById('categories-data').textContent
    );

    const categoryCounts = JSON.parse(
        document.getElementById('category-counts-data').textContent
    );

    const saleDatesLabels = JSON.parse(
        document.getElementById('sale-dates-labels-data').textContent
    );

    const saleDatesValues = JSON.parse(
        document.getElementById('sale-dates-values-data').textContent
    );


    // =========================
    // Doughnut Chart
    // =========================

    const pieCanvas = document.getElementById('pieChart');

    if (pieCanvas) {
        new Chart(pieCanvas, {
            type: 'doughnut',

            data: {
                labels: categories,

                datasets: [{
                    data: categoryCounts,

                    backgroundColor: [
                        '#FF6384',
                        '#36A2EB',
                        '#FFCE56',
                        '#4BC0C0',
                        '#9966FF',
                        '#FF9F40',
                        '#E7E9ED'
                    ],

                    borderWidth: 1
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                cutout: '60%',

                plugins: {
                    legend: {
                        position: 'bottom',

                        labels: {
                            usePointStyle: true,
                            padding: 10
                        }
                    },

                    tooltip: {
                        callbacks: {
                            label: function (tooltipItem) {
                                return tooltipItem.label + ': ' + tooltipItem.raw;
                            }
                        }
                    }
                }
            }
        });
    }


    // =========================
    // Line Chart
    // =========================

    const lineCanvas = document.getElementById('lineChart');

    if (lineCanvas) {
        new Chart(lineCanvas, {
            type: 'line',

            data: {
                labels: saleDatesLabels,

                datasets: [{
                    label: 'Sales Over Time',

                    data: saleDatesValues,

                    fill: false,

                    borderColor: '#4BC0C0',

                    backgroundColor: '#4BC0C0',

                    tension: 0.1,

                    borderWidth: 2,

                    pointRadius: 4,

                    pointHoverRadius: 6
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                plugins: {
                    legend: {
                        position: 'top'
                    },

                    tooltip: {
                        callbacks: {
                            label: function (tooltipItem) {
                                return 'Sales: ' + tooltipItem.raw;
                            }
                        }
                    }
                },

                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

});
</script>


<style>
.chart-container {
    position: relative;
    width: 100%;
    height: 400px;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
