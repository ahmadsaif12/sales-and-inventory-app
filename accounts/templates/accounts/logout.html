{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% load static %}

        <link rel="stylesheet" href="{% static 'fontawesome/css/all.css' %}" type="text/css">
        <link rel="stylesheet" type="text/css" href="https://unpkg.com/@webpixels/css@1.1.5/dist/index.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">
        <title>IMS: Logout</title>
    </head>
    <body class="auth-utility-page">
        <main class="auth-utility-card">
            <span class="auth-utility-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
            <h1>You have logged out</h1>
            <p>Your workspace is secure. Sign in when you are ready to continue.</p>
            <a class="btn btn-success" href="{% url 'user-login' %}"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign in again</a>
        </main>
    </body>
</html>
